<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Narshe — Part I Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #1b2233 0%, #2a3550 60%, #3d4a6b 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8eaf0;
  }
  .card {
    background: rgba(15, 20, 33, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 3rem 2.8rem 2.6rem;
    width: min(400px, 90vw);
    text-align: center;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(6px);
  }
  h1 {
    font-size: 1.55rem;
    letter-spacing: 0.14em;
    font-weight: 600;
    margin-bottom: 0.4rem;
  }
  .sub {
    color: #9aa4bd;
    font-size: 0.88rem;
    letter-spacing: 0.06em;
    margin-bottom: 2rem;
  }
  input {
    width: 100%;
    padding: 0.7rem 0.9rem;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.07);
    color: #e8eaf0;
    outline: none;
    text-align: center;
    letter-spacing: 0.08em;
  }
  input:focus { border-color: #7f96c9; }
  button {
    margin-top: 1rem;
    width: 100%;
    padding: 0.7rem;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    border: none;
    border-radius: 8px;
    background: #5b74ab;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #6b85bf; }
  .err {
    color: #e0908f;
    font-size: 0.85rem;
    margin-top: 0.9rem;
    min-height: 1.2em;
    visibility: hidden;
  }
  .err.show { visibility: visible; }
</style>
</head>
<body>
  <form class="card" id="gate">
    <h1>NARSHE</h1>
    <div class="sub">PART I &nbsp;·&nbsp; PRIVATE PREVIEW</div>
    <input type="password" id="pw" placeholder="Password" autocomplete="off" autofocus>
    <button type="submit">Enter</button>
    <div class="err" id="err">Incorrect password.</div>
  </form>
<script>
  // The folder name is derived from the password and appears nowhere in this
  // page; VERIFY uses a different salt, so it reveals nothing about the folder.
  const VERIFY = '01c928a6e9ed3e0a0e78f93d314bae36c9827dd3fbdd46e82c048e25196a12b7';
  const sha = async (s) => {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  };
  document.getElementById('gate').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value.trim();
    if (await sha(pw + ':narshe-verify-salt-2026') === VERIFY) {
      location.href = './' + (await sha(pw + ':narshe-gate-salt-2026')).slice(0, 16) + '/';
    } else {
      document.getElementById('err').classList.add('show');
    }
  });
</script>
</body>
</html>
