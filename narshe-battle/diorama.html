<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narshe — Snowy Mining Town Diorama</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14172a; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(30,40,70,0.22) 100%);
  }
  #title {
    position: fixed; top: 18px; left: 22px; pointer-events: none;
    font-family: Georgia, 'Times New Roman', serif; color: #26325e;
    text-shadow: 0 1px 8px rgba(255,255,255,0.6); letter-spacing: 0.22em;
  }
  #title .big { font-size: 21px; font-variant: small-caps; }
  #title .sub { font-size: 11px; color: #8a97b8; letter-spacing: 0.30em; margin-top: 3px; }
  #controls {
    position: fixed; bottom: 20px; left: 24px;
    display: flex; gap: 12px; align-items: center; user-select: none;
  }
  .rot-btn {
    width: 54px; height: 54px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(160,180,220,0.35);
    background: rgba(24,30,52,0.72); backdrop-filter: blur(4px);
    color: #dbe4f8; font-size: 26px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.05s;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45);
  }
  .rot-btn:hover { background: rgba(46,58,96,0.85); }
  .rot-btn:active { transform: scale(0.94); }
  .hint {
    font-family: ui-monospace, Menlo, monospace; font-size: 10px;
    color: #7c89aa; text-align: center; margin-top: 4px; letter-spacing: 0.08em;
  }
  .btn-wrap { display: flex; flex-direction: column; align-items: center; }

  /* ---------------------------------------------------------- GAME UI */
  .panel {
    background: rgba(18,23,42,0.74); backdrop-filter: blur(4px);
    border: 1px solid rgba(150,170,215,0.24); border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
  }
  .caps {
    font-family: Georgia, 'Times New Roman', serif; font-variant: small-caps;
    letter-spacing: 0.14em;
  }
  #turnstrip {
    position: fixed; top: 10px; right: 10px; width: 86px;
    user-select: none; padding: 7px 7px 4px;
  }
  #turnstrip .hdr {
    font-family: ui-monospace, Menlo, monospace; font-size: 9px; letter-spacing: 0.22em;
    color: #7c89aa; margin: 0 1px 4px; text-align: center; white-space: nowrap;
  }
  .chip {
    display: flex; align-items: center; padding: 2px 5px; margin-bottom: 2px;
    border-radius: 7px; background: rgba(10,14,28,0.5);
    border: 1px solid rgba(140,160,205,0.14); transition: background 0.2s, border-color 0.2s;
  }
  .chip.active { border-color: rgba(180,225,255,0.85); background: rgba(44,74,116,0.85); }
  .chip.dead { opacity: 0.28; }
  .chip .sw { width: 13px; height: 13px; border-radius: 4px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4); }
  .chip.dead .sw { filter: grayscale(1); }
  .chip .nm { font-size: 11.5px; color: #d3ddf3; flex: 1; overflow: hidden; white-space: nowrap; }
  .chip .hp { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: #93a3c8; }
  #banner {
    position: fixed; top: 92px; left: 22px; pointer-events: none;
    font-family: Georgia, serif; font-variant: small-caps; letter-spacing: 0.2em;
    font-size: 14px; color: #cfd8ee; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    opacity: 0; transition: opacity 0.3s;
  }
  #banner .sub {
    font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; letter-spacing: 0.16em;
    color: #8a97b8; margin-top: 2px; font-variant: normal;
  }
  #actionbar {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 9px; user-select: none; padding: 8px; align-items: center;
  }
  .act-btn {
    font-family: Georgia, serif; font-variant: small-caps; letter-spacing: 0.13em;
    font-size: 13px; padding: 8px 17px; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(160,180,220,0.32); background: rgba(30,38,64,0.8);
    color: #dbe4f8; transition: background 0.15s, border-color 0.15s, transform 0.05s;
  }
  .act-btn:hover:not(:disabled) { background: rgba(54,70,112,0.92); }
  .act-btn:active:not(:disabled) { transform: scale(0.96); }
  .act-btn.on { background: rgba(52,120,168,0.92); border-color: rgba(190,232,255,0.9); color: #eef8ff; }
  .act-btn:disabled { opacity: 0.3; cursor: default; }
  .act-btn.kbd {
    outline: 3px solid #fff0a6;
    outline-offset: 3px;
    box-shadow: 0 0 0 1.5px rgba(14,18,44,0.9), 0 0 16px rgba(255,224,112,0.9);
  }
  #actionbar.off { opacity: 0.35; pointer-events: none; }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 22px; background: rgba(8,10,20,0.72); backdrop-filter: blur(3px);
  }
  #overlay.show { display: flex; }
  #overlay .word {
    font-family: Georgia, serif; font-variant: small-caps; letter-spacing: 0.3em;
    font-size: 54px; color: #e6edff; text-shadow: 0 4px 26px rgba(0,0,0,0.9);
  }
  #overlay.lose .word { color: #e8a0a8; }
  #overlay .rst {
    font-family: Georgia, serif; font-variant: small-caps; letter-spacing: 0.16em;
    font-size: 15px; padding: 11px 30px; border-radius: 9px; cursor: pointer;
    border: 1px solid rgba(160,180,220,0.4); background: rgba(30,38,64,0.9); color: #dbe4f8;
  }
  #overlay .rst:hover { background: rgba(54,70,112,0.95); }
  #exploreHint {
    display: none; position: fixed; left: 50%; bottom: 24px;
    transform: translateX(-50%); z-index: 22; max-width: calc(100vw - 36px);
    padding: 10px 18px; border: 1px solid rgba(202,224,255,0.58);
    border-radius: 9px; background: rgba(17,25,46,0.9);
    color: #edf4ff; box-shadow: 0 8px 28px rgba(8,14,28,0.28);
    font: 650 13px/1.35 system-ui, sans-serif; letter-spacing: 0.03em;
    text-align: center; pointer-events: none;
  }
  #exploreHint.show { display: block; }
  #exploreHint .keys { color: #ffd479; white-space: nowrap; }
  body.exploring #turnstrip,
  body.exploring #actionbar,
  body.exploring #unitpanel { display: none !important; }

  /* ---------------------------------------------------------- TP + abilities */
  #tp { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 2px; }
  #tp .lab {
    font-family: ui-monospace, Menlo, monospace; font-size: 9px; letter-spacing: 0.18em; color: #7c89aa;
  }
  #tp .pips { display: flex; gap: 3px; }
  #tp .pip {
    width: 8px; height: 8px; border-radius: 50%;
    border: 1px solid rgba(150,180,225,0.45); background: rgba(10,14,28,0.6);
  }
  #tp .pip.on { background: #8fd6ff; border-color: rgba(200,238,255,0.95); box-shadow: 0 0 6px rgba(120,210,255,0.7); }
  #abils { display: flex; gap: 9px; }
  .act-btn.abil { border-color: rgba(190,160,235,0.4); background: rgba(44,34,68,0.82); }
  .act-btn.abil:hover:not(:disabled) { background: rgba(72,54,110,0.92); }
  .act-btn.abil.on { background: rgba(126,84,190,0.92); border-color: rgba(226,196,255,0.9); color: #f6eeff; }
  .act-btn .cost {
    font-family: ui-monospace, Menlo, monospace; font-size: 9px; letter-spacing: 0.06em;
    color: #b9a7e2; margin-left: 7px; font-variant: normal;
  }
  .chip .tpc {
    font-family: ui-monospace, Menlo, monospace; font-size: 8.5px; color: #8fd6ff;
    border: 1px solid rgba(120,190,240,0.35); border-radius: 4px; padding: 0 3px; flex: none;
  }
  .chip.dead .tpc { display: none; }
  .sep { width: 1px; height: 24px; background: rgba(150,170,215,0.22); }

  /* ---------------------------------------------------------- dialogue */
  /* FFT-style speech bubble, anchored to the speaking unit (ramza_dialogue.png) */
  #dlg { position: fixed; inset: 0; display: none; z-index: 40; cursor: pointer; }
  #dlg.show { display: block; }
  /* sized off ramza_dialogue.png: the bubble owns a large slice of the screen and
     the portrait is big enough to read a face at a glance */
  #dlg .dpanel {
    position: absolute; box-sizing: border-box; width: 900px; max-width: 93vw; padding: 18px 26px 14px;
    background: linear-gradient(180deg, #f7f0dd 0%, #efe5cc 100%);
    border: 2px solid #b3a382; border-radius: 15px;
    box-shadow: 0 4px 0 #8d7d5c, 0 12px 30px rgba(30,26,14,0.45);
    display: flex; gap: 18px; align-items: center;
  }
  /* portrait column: the name sits centred over the face, as its caption */
  #dlg .dport { width: 150px; flex: none; align-self: flex-start; text-align: center; }
  #dlg .facecrop {
    width: 150px; height: 150px; overflow: hidden;
    border-radius: 10px; border: 2px solid #b3a382;
    background: #e3d8bd; box-shadow: 0 2px 8px rgba(30,26,14,0.35);
  }
  #dlg .dport img {
    display: block; width: 100%; height: 100%; object-fit: cover;
    transform-origin: 50% 50%;
    transform: translate(var(--portrait-x, 0px), var(--portrait-y, 0px))
               scale(var(--portrait-scale, 1));
  }
  #dlg .dmain { flex: 1; min-width: 0; }
  #dlg .spk { font-weight: 700; font-size: 19px; color: #6b5a38; letter-spacing: 0.03em; margin-bottom: 7px; }
  #dlg .ln { font-size: 22px; line-height: 1.58; color: #38301f; min-height: 1.4em; }
  #dlg .adv { font-size: 11px; letter-spacing: 0.16em; color: #a08f6b; text-align: right; margin-top: 6px; }
  #dlg .tail {
    position: absolute; width: 0; height: 0;
    border-left: 15px solid transparent; border-right: 15px solid transparent;
  }
  #dlg .tail.up { top: -18px; border-bottom: 19px solid #b3a382; }
  #dlg .tail.up::after { content: ""; position: absolute; left: -12px; top: 3.5px;
    border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 16px solid #f7f0dd; }
  #dlg .tail.down { bottom: -18px; border-top: 19px solid #b3a382; }
  #dlg .tail.down::after { content: ""; position: absolute; left: -12px; bottom: 3.5px;
    border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 16px solid #efe5cc; }
  #audioWrap { position: fixed; bottom: 92px; left: 24px; user-select: none; }
  #audioBtn.muted { opacity: 0.4; text-decoration: line-through; }
  /* ---------------------------------------------------------- combat forecast */
  #forecast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: stretch; pointer-events: none;
    opacity: 0; transition: opacity 0.14s; z-index: 30;
  }
  #forecast.show { opacity: 1; }
  .fcCard {
    display: flex; gap: 10px; align-items: center; min-width: 232px; max-width: 270px;
    background: rgba(16,22,42,0.92); border: 1px solid rgba(150,175,225,0.4);
    border-radius: 10px; padding: 9px 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.5);
  }
  .fcCard.tgt { flex-direction: row-reverse; text-align: right; border-color: rgba(240,140,120,0.45); }
  .fcCard img { width: 52px; height: 52px; border-radius: 8px; border: 1px solid rgba(160,180,220,0.5);
    background: #1a2036; object-fit: cover; flex: none; }
  .fcInfo { flex: 1; min-width: 0; }
  .fcName { font-family: Georgia, serif; font-variant: small-caps; font-size: 15px;
    color: #e6ecfb; letter-spacing: 0.06em; line-height: 1.1; }
  .fcRole { font-size: 9.5px; color: #8a97b8; letter-spacing: 0.1em; margin: 1px 0 5px; }
  .fcBar { position: relative; height: 9px; border-radius: 5px; background: rgba(8,10,20,0.9);
    border: 1px solid rgba(140,160,200,0.35); overflow: hidden; }
  .fcBar .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg,#69d693,#3da765); border-radius: 4px; }
  .fcBar .lose { position: absolute; top: 0; bottom: 0; background: linear-gradient(180deg,#ff7a5c,#d8402c);
    animation: fcPulse 0.9s ease-in-out infinite; }
  .fcBar .lose.self { background: linear-gradient(180deg,#c99cf2,#8a58d6); }
  @keyframes fcPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .fcHp { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #c6d2ea; margin-top: 4px; }
  .fcHp .to { color: #ff9a80; }
  .fcMid {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    min-width: 96px; padding: 6px 14px; background: rgba(10,14,30,0.94);
    border: 1px solid rgba(150,175,225,0.45); border-radius: 10px;
    clip-path: polygon(8% 0, 92% 0, 100% 50%, 92% 100%, 8% 100%, 0 50%);
  }
  .fcMid .num { font-family: Georgia, serif; font-size: 24px; color: #ffd9a8; line-height: 1.05; }
  .fcMid .lab { font-size: 8.5px; letter-spacing: 0.28em; color: #8a97b8; margin-top: 3px; }
  .fcRows { display: flex; flex-direction: column; gap: 5px; justify-content: center;
    background: rgba(16,22,42,0.92); border: 1px solid rgba(240,140,120,0.4);
    border-radius: 10px; padding: 8px 12px; min-width: 250px; }
  .fcRow { display: grid; grid-template-columns: 26px 104px 1fr auto; gap: 8px; align-items: center; }
  .fcRow .fcName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fcRow img { width: 24px; height: 24px; border-radius: 5px; border: 1px solid rgba(160,180,220,0.4); }
  .fcRow .fcName { font-size: 12px; }
  .fcRow .fcBar { height: 7px; }
  .fcRow .fcHp { margin: 0; font-size: 10.5px; white-space: nowrap; }
  #btnUndo.hidden { display: none; }
  .chip .psn { color: #8fe07a; font-size: 9px; letter-spacing: 0.08em; margin-left: 4px; }

  /* ---------------------------------------------------------- active unit panel (TS-style, bottom-left) */
  #unitpanel {
    position: fixed; left: 22px; bottom: 108px; z-index: 25;
    display: none; gap: 12px; align-items: stretch;
    background: rgba(14,19,38,0.93); border: 1px solid rgba(150,175,225,0.45);
    border-radius: 12px; padding: 12px 16px 12px 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.55);
  }
  #unitpanel.show { display: flex; }
  #unitpanel.enemy { border-color: rgba(240,120,100,0.55); }
  .upFace { width: 84px; height: 84px; border-radius: 10px; object-fit: cover;
    border: 1px solid rgba(160,180,220,0.55); background: #1a2036; align-self: center; }
  #unitpanel.enemy .upFace { border-color: rgba(240,140,120,0.6); }
  .upBody { display: flex; flex-direction: column; justify-content: center; gap: 3px; min-width: 172px; }
  .upName { font-family: Georgia, serif; font-variant: small-caps; font-size: 19px;
    color: #eef2fc; letter-spacing: 0.05em; line-height: 1.05; }
  .upTag { font-size: 10px; color: #ff9d86; letter-spacing: 0.2em; margin-left: 8px; }
  .upRole { font-size: 11.5px; color: #9daac9; letter-spacing: 0.08em; }
  .upHpRow { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .upBar { position: relative; flex: 1; height: 10px; border-radius: 5px;
    background: rgba(8,10,20,0.9); border: 1px solid rgba(140,160,200,0.4); overflow: hidden; }
  .upBar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px;
    background: linear-gradient(180deg,#69d693,#3da765); transition: width 0.25s; }
  .upHp { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #d7e0f2; }
  .upTp { font-size: 13px; letter-spacing: 0.14em; color: #3a4468; margin-top: 1px; }
  .upTp .on { color: #ffd479; }
  .upStatus { display: flex; gap: 6px; margin-top: 3px; min-height: 16px; flex-wrap: wrap; }
  .upStatus span { font-size: 9.5px; letter-spacing: 0.12em; padding: 2px 7px; border-radius: 4px;
    border: 1px solid; }
  .upStatus .stPsn { color: #9fe88c; border-color: rgba(140,220,120,0.5); background: rgba(50,90,40,0.35); }
  .upStatus .stAim { color: #ffcf8e; border-color: rgba(255,190,110,0.5); background: rgba(96,64,20,0.35); }
  .upStatus .stGrd { color: #9fd4ff; border-color: rgba(130,190,255,0.5); background: rgba(30,60,100,0.35); }
  .upStatus .stMrk { color: #ffab90; border-color: rgba(255,150,120,0.5); background: rgba(100,40,26,0.35); }
  /* ---------------------------------------------------------- readability overrides */
  body { -webkit-font-smoothing: antialiased; }
  #title .sub { font-size: 12px; letter-spacing: 0.2em; color: #46527c; text-shadow: 0 1px 6px rgba(255,255,255,0.5); }
  .hint { font-size: 11px; color: #93a0bf; }
  #turnstrip .hdr { font-size: 11px; letter-spacing: 0.16em; }
  .chip .nm { font-size: 13.5px; }
  .chip .hp, .chip .tpc { font-size: 12px; }
  .act-btn { font-size: 14px; }
  .fcName { font-size: 16px; }
  .fcRole { font-size: 10.5px; letter-spacing: 0.08em; color: #9daac9; }
  .fcHp { font-size: 12.5px; }
  .fcMid .lab { font-size: 10px; letter-spacing: 0.2em; color: #9daac9; }
  #tp { display: none; }   /* TP lives in the unit panel now */
  #turnstrip { min-width: 0; }
  #audioWrap { left: auto; right: 22px; bottom: 22px; }

  /* ---------------------------------------------------------- FF6-style UI pass */
  #turnstrip, #actionbar, #unitpanel, .fcCard, .fcMid, .fcRows {
    background: linear-gradient(180deg, #3d4fc0 0%, #26339c 34%, #131c66 100%);
    border: 2px solid #e9eefb;
    box-shadow: 0 0 0 2px rgba(14,18,44,0.9), 0 8px 22px rgba(10,16,40,0.45);
  }
  .fcCard.tgt { border-color: #ffd9c8; }
  #unitpanel.enemy { border-color: #ffd9c8; }
  body, .panel, #forecast { color: #ffffff; }
  #turnstrip .hdr { color: #dfe6fa; font-size: 12px; letter-spacing: 0.18em;
    text-shadow: 1px 1px 0 rgba(10,14,40,0.9); }
  .chip .nm { font-size: 15px; color: #fff; text-shadow: 1px 1px 0 rgba(10,14,40,0.9); }
  .chip .hp, .chip .tpc { font-size: 12.5px; color: #dfe6fa; text-shadow: 1px 1px 0 rgba(10,14,40,0.85); }
  .chip.active { background: rgba(255,255,255,0.14); border-radius: 6px; }
  .act-btn {
    font-size: 16px; padding: 9px 16px; color: #fff;
    background: linear-gradient(180deg, #5265d6 0%, #3242ae 60%, #202c86 100%);
    border: 1.5px solid #e9eefb; border-radius: 8px;
    text-shadow: 1px 1px 0 rgba(10,14,40,0.9);
    box-shadow: 0 0 0 1.5px rgba(14,18,44,0.85);
  }
  .act-btn:hover:not(:disabled) { background: linear-gradient(180deg, #6577e6 0%, #3f50c2 60%, #28349a 100%); }
  .act-btn:disabled { opacity: 0.45; }
  .act-btn.on { border-color: #ffd479; box-shadow: 0 0 0 1.5px rgba(14,18,44,0.85), 0 0 10px rgba(255,212,121,0.5); }
  .act-btn .cost { color: #ffd479; }
  .upName { font-size: 22px; color: #fff; text-shadow: 1px 2px 0 rgba(10,14,40,0.9); }
  .upRole { font-size: 12.5px; color: #dfe6fa; }
  .upHp { font-size: 14px; color: #fff; }
  .upTp { color: rgba(255,255,255,0.28); }
  .upTp .on { color: #ffd479; }
  .fcName { font-size: 17px; color: #fff; text-shadow: 1px 1px 0 rgba(10,14,40,0.9); }
  .fcRole { color: #dfe6fa; }
  .fcHp { font-size: 13px; color: #fff; }
  .fcMid .num { font-size: 28px; color: #ffe1a8; text-shadow: 1px 2px 0 rgba(10,14,40,0.95); }
  .fcMid .lab { color: #dfe6fa; }
  .rot-btn { background: linear-gradient(180deg, #3d4fc0 0%, #26339c 40%, #131c66 100%);
    border: 1.5px solid #e9eefb; color: #fff; }
  .hint { color: #223055; font-weight: 600; text-shadow: 0 1px 4px rgba(255,255,255,0.55); }
  .upStatus span { font-size: 10.5px; }
  #overlay .word { text-shadow: 0 4px 18px rgba(10,16,40,0.8); }

  /* ---------------------------------------------------------- readable sans + layout pass */
  :root { --ui: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  #turnstrip, #actionbar, #unitpanel, #dlg, #forecast, #overlay, .hint, .rot-btn {
    font-family: var(--ui);
  }
  .caps, .upName, .fcName, .chip .nm, #dlg .spk, #turnstrip .hdr {
    font-family: var(--ui); font-variant: normal; letter-spacing: 0.02em;
  }
  .chip .nm { font-weight: 640; font-size: 12.5px; }
  .upName { font-weight: 700; font-size: 20px; }
  .fcName { font-weight: 650; font-size: 16px; }
  #turnstrip .hdr { font-weight: 650; letter-spacing: 0.08em; }
  .act-btn { font-family: var(--ui); font-weight: 640; letter-spacing: 0.01em; }
  /* The bubble is the one place that keeps a book face: the system sans reads
     clinical against parchment. Everything else in the UI stays on --ui. */
  :root { --dlg: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif; }
  #dlg .spk { font-family: var(--dlg); font-weight: 700; font-size: 17px; letter-spacing: 0.03em;
    margin-bottom: 6px; text-align: center; }

const texPlankDk = plankTex(55, '#4b3a28', '#2a2014', 'rgba(32,24,15,0.55)');

// which is right for the world and wrong for the UI painted into it — it lifts and

// #5fd08a fill reaching the screen as #92d4a8). Per-material `toneMapped:false`
// cannot help, because in a composer the grade happens after everything is
// composited, not per material.

// deliver the colour I asked for", by inverting the grade numerically. Nothing
// about the world's look changes; only UI chrome is authored through it.
const ACES_IN = [[0.59719, 0.35458, 0.04823], [0.07600, 0.90834, 0.01566], [0.02840, 0.13383, 0.83777]];
const ACES_OUT = [[1.60475, -0.53108, -0.07367], [-0.10208, 1.10813, -0.00605], [-0.00327, -0.07276, 1.07602]];

const CENTER = new THREE.Vector3(W / 2, 1.8, D / 2);

renderer.domElement.addEventListener('pointerdown', ev => {
  if (ev.button !== 0) return;
  panDrag = { sx: ev.clientX, sy: ev.clientY, cx: CENTER.x, cz: CENTER.z, moved: false, ev };
});
addEventListener('pointermove', ev => {
  if (!panDrag || !(ev.buttons & 1)) return;
  const dx = ev.clientX - panDrag.sx, dy = ev.clientY - panDrag.sy;
  if (!panDrag.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
  panDrag.moved = true;
  glide = null; zoomAnim = null;      // dragging is the player taking the camera back
  const wpp = (2 * DIST * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / camera.zoom) / innerHeight;
  const rx = Math.cos(azimuth), rz = -Math.sin(azimuth);          // screen-right on the ground
  const fx = -Math.sin(azimuth), fz = -Math.cos(azimuth);         // screen-up on the ground (away from camera)
  const gy = wpp / Math.sin(ELEV);                                // vertical drags foreshorten
  CENTER.x = panDrag.cx - (dx * wpp * rx) + (dy * gy * fx);
  CENTER.z = panDrag.cz - (dx * wpp * rz) + (dy * gy * fz);
  clampCenter();
  placeCamera();
});
addEventListener('pointerup', ev => {
  if (!panDrag) return;
  const wasTap = !panDrag.moved && ev.button === 0;
  const downEv = panDrag.ev, fromDlg = panDrag.dlg;
  panDrag = null;
  if (!wasTap) return;                 // clicks act only when the pointer never dragged
  if (fromDlg) advanceDialogue(); else handleTap(downEv);
});

// ---------------------------------------------------------------- terrain
const topThick = 0.09;
const tileMeshes = [];                 // walkable tile tops, tagged with grid coords for picking
const tileTop = [];                    // world-space y of each tile's walkable surface
for (let z = 0; z < D; z++) tileTop.push(new Array(W).fill(0));
for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
  const t = T[z][x];
  const cx = x + 0.5, cz = z + 0.5;
  if (t === STAIR) {
    const s = S[z][x];
    const yLo = s.lo * HU, yHi = s.hi * HU;
    box(TILE, yLo, TILE, mat.rock, cx, yLo / 2, cz);
    const steps = Math.max(3, (s.hi - s.lo) * 2), rise = (yHi - yLo) / steps;
    let last = null;
    for (let i = 0; i < steps; i++) {
      const frac = (i + 1) / steps;
      const w = s.dir[0] !== 0 ? TILE * frac : TILE;
      const d = s.dir[1] !== 0 ? TILE * frac : TILE;
      const ox = s.dir[0] !== 0 ? s.dir[0] * (TILE - w) / 2 : 0;
      const oz = s.dir[1] !== 0 ? s.dir[1] * (TILE - d) / 2 : 0;
      last = box(w, rise, d, mat.path, cx + ox, yLo + rise * (i + 0.5), cz + oz);
    }
    tileTop[z][x] = yHi;
    last.userData.tile = { x, z };     // top step doubles as the pick target
    tileMeshes.push(last);
    continue;
  }
  const h = Math.max(H[z][x], 1) * HU;
  if (t === ROCK) {
    const jitter = hash(x, z + 200) * 0.22;
    box(TILE, h + jitter, TILE, mat.rock, cx, (h + jitter) / 2, cz);
    const dusted = hash(x, z + 300) > 0.06;
    box(TILE * 0.98, topThick, TILE * 0.98, dusted ? mat.snow : mat.rock, cx, h + jitter + topThick / 2 - 0.001, cz);
    tileTop[z][x] = h + jitter + topThick;
  } else {
    box(TILE, h, TILE, mat.rock, cx, h / 2, cz);
    let topM;
    if (t === SNOW) topM = mat.snow;
    else if (t === PATH) topM = mat.path;
    else if (t === ICE) topM = mat.ice;
    else topM = mat.wood;
    const top = box(TILE * 0.997, topThick, TILE * 0.997, topM, cx, h + topThick / 2 - 0.001, cz);
    tileTop[z][x] = h + topThick;
    top.userData.tile = { x, z };
    tileMeshes.push(top);
  }
}

// ---------------------------------------------------------------- rugged buildings
const smokeStacks = [];
const buildingOccluders = [];
const occlusionRay = new THREE.Raycaster();
const occlusionTarget = new THREE.Vector3();
const occlusionDirection = new THREE.Vector3();
const occlusionRight = new THREE.Vector3();
const BUILDING_GHOST_OPACITY = 0.16;
function registerBuildingOccluder(group, name) {
  const materials = new Set();
  group.traverse(object => {
    if (!object.isMesh || !object.material) return;
    const sources = Array.isArray(object.material) ? object.material : [object.material];
    const clones = sources.map(source => {
      const material = source.clone();
      material.userData.occlusionBase = {
        opacity: source.opacity,
        transparent: source.transparent,
        depthWrite: source.depthWrite,
      };
      materials.add(material);
      return material;
    });
    object.material = Array.isArray(object.material) ? clones : clones[0];
  });
  buildingOccluders.push({ name, group, materials: [...materials], opacity: 1, blocked: false });
}
function buildingBlocksUnit(building, unit) {
  // A roof can hide a figure's feet without crossing the torso ray (especially
  // on stepped terrain). Sample the readable body column rather than one point:
  // if scenery masks any substantial band, cut the whole building away.
  camera.updateMatrixWorld();
  occlusionRight.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
  const width = unit.sprite && unit.sprite.geometry.parameters.width || 1;
  for (const ratio of [0.18, 0.46, 0.74]) {
    for (const spread of [-0.38, 0, 0.38]) {
      occlusionTarget.set(
        unit.group.position.x,
        unit.group.position.y + unit.topY * ratio,
        unit.group.position.z,
      ).addScaledVector(occlusionRight, width * spread);
      occlusionDirection.copy(occlusionTarget).sub(camera.position);
      const distance = occlusionDirection.length();
      if (distance <= 0.1) continue;
      occlusionRay.set(camera.position, occlusionDirection.multiplyScalar(1 / distance));
      occlusionRay.far = distance - 0.12;
      if (occlusionRay.intersectObject(building.group, true).length) return true;
    }
  }
  return false;
}
function setBuildingOpacity(building, opacity) {
  for (const material of building.materials) {
    const base = material.userData.occlusionBase;
    material.opacity = base.opacity * opacity;
    const ghosted = opacity < 0.995;
    if (material.transparent !== (base.transparent || ghosted) ||
        material.depthWrite !== (ghosted ? false : base.depthWrite)) {
      material.transparent = base.transparent || ghosted;
      material.depthWrite = ghosted ? false : base.depthWrite;
      material.needsUpdate = true;
    }
  }
}
function updateBuildingOcclusion(dt) {
  if (!world.visible) return;
  const visibleUnits = units.filter(unit => unit.alive && unit.group.parent);
  const blend = 1 - Math.exp(-dt * 11);
  for (const building of buildingOccluders) {
    building.blocked = visibleUnits.some(unit => buildingBlocksUnit(building, unit));
    const target = building.blocked ? BUILDING_GHOST_OPACITY : 1;
    building.opacity += (target - building.opacity) * blend;
    if (Math.abs(building.opacity - target) < 0.002) building.opacity = target;
    setBuildingOpacity(building, building.opacity);
  }
}
function cabin(cx, baseH, cz, { w = 2.6, d = 2.0, wallH = 0.95, roofH = 0.75, rotY = 0, windows = 2, chimney = true, shed = false } = {}) {
  const g = new THREE.Group();
  // rough stone footing
  box(w + 0.16, 0.26, d + 0.16, mat.stone, 0, 0.13, 0, { group: g });
  // plank walls
  box(w, wallH, d, mat.plank, 0, 0.26 + wallH / 2, 0, { group: g });
  // heavy corner posts + sill/top beams
  const py = 0.26 + wallH / 2;
  for (const sx of [-1, 1]) for (const sz of [-1, 1])
    box(0.14, wallH, 0.14, mat.beam, sx * (w / 2 - 0.02), py, sz * (d / 2 - 0.02), { group: g });
  box(w + 0.06, 0.1, d + 0.06, mat.beam, 0, 0.26 + wallH - 0.04, 0, { group: g });
  const ry = 0.26 + wallH;
  if (shed) {
    // single-slope shed roof, high side at -x
    const slope = Math.hypot(roofH, w + 0.4);
    const ang = Math.atan2(roofH, w + 0.4);
    const plane = box(slope, 0.08, d + 0.45, mat.plankDk, 0, ry + roofH / 2, 0, { group: g });
    plane.rotation.z = ang;
    const snowP = box(slope * 0.98, 0.09, d + 0.5, mat.snow, 0, ry + roofH / 2 + 0.08, 0, { group: g });
    snowP.rotation.z = ang;
  } else {
    const slope = Math.hypot(roofH, w / 2 + 0.22);
    const ang = Math.atan2(roofH, w / 2 + 0.11);
    for (const s of [-1, 1]) {
      const plane = box(slope, 0.08, d + 0.5, mat.plankDk, s * (w / 4 + 0.05), ry + roofH / 2, 0, { group: g });
      plane.rotation.z = -s * ang;
      const snowP = box(slope * 0.98, 0.09, d + 0.56, mat.snow, s * (w / 4 + 0.05), ry + roofH / 2 + 0.08, 0, { group: g });
      snowP.rotation.z = -s * ang;
    }
    box(0.2, 0.12, d + 0.6, mat.snow, 0, ry + roofH + 0.05, 0, { group: g });
    const shape = new THREE.Shape();
    shape.moveTo(-w / 2, 0); shape.lineTo(w / 2, 0); shape.lineTo(0, roofH); shape.closePath();
    const triGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.08, bevelEnabled: false });
    for (const sz of [-1, 1]) {
      const tri = new THREE.Mesh(triGeo, mat.plank);
      tri.position.set(0, ry, sz * (d / 2 - 0.04) - 0.04);
      tri.castShadow = true; tri.receiveShadow = true;
      g.add(tri);
    }
  }
  // plank door + small dim windows
  box(0.44, 0.6, 0.06, mat.plankDk, w * 0.2, 0.26 + 0.3, d / 2 + 0.02, { group: g, shadow: false });
  for (let i = 0; i < windows; i++) {
    const wx = -w / 2 + (i + 0.75) * (w / (windows + 0.5));
    box(0.26, 0.26, 0.04, mat.window, wx - w * 0.12, 0.26 + wallH * 0.55, d / 2 + 0.03, { group: g, shadow: false });
    // rough shutters
    box(0.07, 0.3, 0.03, mat.woodDk, wx - w * 0.12 - 0.19, 0.26 + wallH * 0.55, d / 2 + 0.03, { group: g, shadow: false });
    box(0.07, 0.3, 0.03, mat.woodDk, wx - w * 0.12 + 0.19, 0.26 + wallH * 0.55, d / 2 + 0.03, { group: g, shadow: false });
  }
  if (chimney) {
    box(0.32, roofH + 0.75, 0.32, mat.stone, -w * 0.3, ry + (roofH + 0.75) / 2 - 0.1, -d * 0.16, { group: g });
    const sm = new THREE.Group();
    sm.position.set(-w * 0.3, ry + roofH + 0.68, -d * 0.16);
    for (let i = 0; i < 4; i++) {
      const puff = new THREE.Mesh(new THREE.SphereGeometry(0.11 + i * 0.035, 8, 6), mat.smoke.clone());
      puff.position.y = i * 0.3; sm.add(puff);
    }
    g.add(sm); smokeStacks.push(sm);
  }
  g.position.set(cx, baseH * HU, cz);
  g.rotation.y = rotY;
  world.add(g);
  registerBuildingOccluder(g, shed ? 'storehouse' : 'bunkhouse');
  return g;
}

// ---------------------------------------------------------------- realistic pines (jittered silhouettes)
function pine(x, z, s = 1) {
  const cellX = Math.min(W - 1, x | 0), cellZ = Math.min(D - 1, z | 0);
  const y0 = Math.max(H[cellZ][cellX], 1) * HU + hash(x * 3, z * 3) * 0.18;
  const r = mulberry((x * 137 + z * 61) | 0);
  const g = new THREE.Group();
  const totalH = (1.7 + r() * 0.8) * s;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.05 * s, 0.09 * s, totalH * 0.3, 7), mat.trunk);
  trunk.position.y = totalH * 0.14;
  g.add(trunk);
  const tiers = 5 + Math.floor(r() * 2);
  function jitterCone(radius, height, phase) {
    const geo = new THREE.ConeGeometry(radius, height, 9);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const vx = pos.getX(i), vz = pos.getZ(i);
      const rad = Math.hypot(vx, vz);
      if (rad > 0.01) {
        const a = Math.atan2(vz, vx);
        const f = 0.82 + 0.14 * Math.sin(3 * a + phase) + 0.1 * Math.sin(7 * a + phase * 2.1) + 0.06 * Math.sin(11 * a + phase * 0.7);
        pos.setX(i, vx * f); pos.setZ(i, vz * f);
      }
    }
    geo.computeVertexNormals();
    return geo;
  }
  for (let t = 0; t < tiers; t++) {
    const frac = t / tiers;
    const radius = 0.62 * s * (1 - frac * 0.72);
    const tierH = totalH * 0.34;
    const y = totalH * 0.22 + frac * totalH * 0.72;
    const phase = r() * 6.28;
    const cone = new THREE.Mesh(jitterCone(radius, tierH, phase), r() > 0.5 ? mat.pineA : mat.pineB);
    cone.position.y = y;
    cone.rotation.y = r() * 6.28;
    cone.castShadow = true; cone.receiveShadow = true;
    g.add(cone);
    // clinging snow: shallow jittered cap over each tier
    const cap = new THREE.Mesh(jitterCone(radius * 0.88, tierH * 0.38, phase + 1.7), mat.pineSnow);
    cap.position.y = y + tierH * 0.22;
    cap.rotation.y = cone.rotation.y;
    cap.castShadow = false; cap.receiveShadow = true;
    g.add(cap);
  }
  g.rotation.z = (r() - 0.5) * 0.07;
  g.rotation.y = r() * 6.28;
  g.position.set(x, y0, z);
  world.add(g);
}

// ---------------------------------------------------------------- tiny tween runner
const tweens = [];
function tween(dur, onUpdate, onDone) { tweens.push({ t: 0, dur, onUpdate, onDone }); }
function stepTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    const p = Math.min(1, tw.t / tw.dur);
    tw.onUpdate(p);
    if (p >= 1) { tweens.splice(i, 1); if (tw.onDone) tw.onDone(); }
  }
}

// ---------------------------------------------------------------- grid helpers
function inBounds(x, z) { return x >= 0 && x < W && z >= 0 && z < D; }
function walkable(x, z) { return inBounds(x, z) && T[z][x] !== ROCK && !BLOCKED[z][x]; }
// stairs bridge the 2-unit terrace jumps; everything else is a 1-unit step
function stepOK(x0, z0, x1, z1) {
  const lim = (T[z0][x0] === STAIR || T[z1][x1] === STAIR) ? 2 : 1;
  return Math.abs(H[z1][x1] - H[z0][x0]) <= lim;
}
function tileCenter(x, z) { return new THREE.Vector3(x + 0.5, tileTop[z][x], z + 0.5); }
// ranged reach is Chebyshev — a square envelope reads cleanly against the 3×3 burst
function terraceOf(z) { return z >= 14 ? 0 : z >= 10 ? 1 : z >= 6 ? 2 : 3; }

// ---------------------------------------------------------------- pixel-art units
// HD-2D: units are 2D sprites painted one logical pixel at a time and billboarded
// into the 3D diorama (FFT chibi proportions — big head, small body, a face you
// can actually read). Each class supplies a BODY and a HEADGEAR painter; the
// shared skeleton in anat() hands the standing and the downed frame the same
// landmarks, so a class describes its garments once and gets both poses.
const SPX = 32, SPY = 40;      // logical sprite pixels
const SPRITE_H = 1.65;         // world height of the billboard quad
const FOOT_ROW = 38.5;         // the canvas row that rests on the tile top
const INK = '#171320', EYE = '#241d30', MOUTH = '#a4614a';

// k > 1 lightens toward white, k <= 1 darkens — one knob for a whole ramp
function tone(n, k) {
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(k <= 1 ? v * k : v + (255 - v) * (k - 1))));
  return '#' + ((f(r) << 16) | (f(g) << 8) | f(b)).toString(16).padStart(6, '0');
}

// a tiny painter's-algorithm pixel buffer: everything is drawn into a flat array
// of colour strings so the silhouette outline can be derived at the end
function pixBuf() {
  const g = new Array(SPX * SPY).fill(null);
  const api = {
    g,
    px(x, y, c) {
      x = Math.round(x); y = Math.round(y);
      if (c && x >= 0 && y >= 0 && x < SPX && y < SPY) g[y * SPX + x] = c;
      return api;
    },
    rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) api.px(x + i, y + j, c); return api; },
    row(x0, x1, y, c) { for (let x = x0; x <= x1; x++) api.px(x, y, c); return api; },
    col(x, y0, y1, c) { for (let y = y0; y <= y1; y++) api.px(x, y, c); return api; },
    disc(cx, cy, rx, ry, c) {
      for (let y = Math.floor(cy - ry); y <= cy + ry; y++)
        for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
          const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
          if (dx * dx + dy * dy <= 1) api.px(x, y, c);
        }
      return api;
    },
    // trapezoid between two widths — robes, hems, blades
    taper(cx, y0, y1, w0, w1, c) {
      for (let y = y0; y <= y1; y++) {
        const w = y1 === y0 ? w1 : w0 + (w1 - w0) * (y - y0) / (y1 - y0);
        api.row(Math.round(cx - w / 2), Math.round(cx + w / 2) - 1, y, c);
      }
      return api;
    },
    // shading pass: recolour only the pixels that are already a given colour
    over(x, y, w, h, from, to) {
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
        const px = Math.round(x + i), py = Math.round(y + j), k = py * SPX + px;
        if (px >= 0 && py >= 0 && px < SPX && py < SPY && g[k] === from) g[k] = to;
      }
      return api;
    },
    // classic sprite readability: one dark pixel all the way round the silhouette
    outline(c) {
      const o = g.slice();
      for (let y = 0; y < SPY; y++) for (let x = 0; x < SPX; x++) {
        const k = y * SPX + x;
        if (g[k]) continue;
        if ((x > 0 && g[k - 1]) || (x < SPX - 1 && g[k + 1]) ||
            (y > 0 && g[k - SPX]) || (y < SPY - 1 && g[k + SPX])) o[k] = c;
      }
      for (let i = 0; i < o.length; i++) g[i] = o[i];
      return api;
    },
  };
  return api;
}

// the chibi skeleton both frames hang off. 'down' is the same body knelt and
// sunk into its own shoulders, leaning a pixel off-centre.
function anat(pose) {
  return pose === 'down'
    ? { down: true,  lean: 1, headCY: 22, eyeY: 24, chin: 29, torsoTop: 28, torsoBot: 36, torsoW: 13, armTop: 30, hand: 35 }
    : { down: false, lean: 0, headCY: 11, eyeY: 13, chin: 18, torsoTop: 19, torsoBot: 30, torsoW: 12, armTop: 21, hand: 29 };
}

function legs(P, a, cloth, boot) {
  if (a.down) {                                    // folded under the body, boots turned out
    P.rect(9, 33, 15, 4, cloth);
    P.rect(7, 35, 6, 3, boot); P.rect(20, 35, 6, 3, boot);
  } else {
    P.rect(11, 29, 4, 8, cloth); P.rect(17, 29, 4, 8, cloth);
    P.rect(10, 35, 6, 3, boot);  P.rect(16, 35, 6, 3, boot);
  }
}
function torso(P, a, col, lo, hi) {
  const x = 16 + a.lean - (a.torsoW >> 1), h = a.torsoBot - a.torsoTop;
  P.rect(x, a.torsoTop, a.torsoW, h, col);
  P.rect(x, a.torsoTop, 2, h, hi);                 // light rakes in from the upper left
  P.rect(x + a.torsoW - 2, a.torsoTop, 2, h, lo);
}
function arms(P, a, sleeve, lo, skin) {
  const y = a.armTop, h = a.hand - y, L = 7 + a.lean, R = 22 + a.lean;
  P.rect(L, y, 3, h, sleeve); P.col(L, y, y + h - 1, lo);
  P.rect(R, y, 3, h, sleeve); P.col(R + 2, y, y + h - 1, lo);
  P.rect(L, a.hand, 3, 2, skin); P.rect(R, a.hand, 3, 2, skin);
}
function head(P, a, skin, skinLo) {
  const cx = 16 + a.lean;
  P.disc(cx, a.headCY, 7, 7.4, skin);
  P.over(cx + 3, a.headCY - 7, 5, 13, skin, skinLo);   // the camera-right cheek falls off
  P.rect(cx - 2, a.chin, 4, 2, skinLo);                // neck
}
// hats and hoods that hug the skull exactly: walk the head disc's own rows
function skullRows(P, a, y0, y1, col, grow = 0) {
  const cx = 16 + a.lean;
  for (let y = y0; y <= y1; y++) {
    const dy = (y + 0.5 - a.headCY) / (7.4 + grow);
    const w = Math.sqrt(Math.max(0, 1 - dy * dy)) * (7 + grow);
    if (w >= 0.5) P.row(Math.round(cx - w), Math.round(cx + w) - 1, y, col);
  }
}
// eyes sit a pixel right of centre so the sprite reads as looking where it walks
function face(P, a) {
  const cx = 16 + a.lean;
  if (a.down) {                                    // out of the fight: eyes closed
    P.row(cx - 5, cx - 3, a.eyeY + 1, EYE);
    P.row(cx + 2, cx + 4, a.eyeY + 1, EYE);
    P.row(cx - 1, cx, a.eyeY + 3, MOUTH);
    return;
  }
  P.rect(cx - 4, a.eyeY, 2, 2, EYE);
  P.rect(cx + 3, a.eyeY, 2, 2, EYE);
  P.rect(cx - 1, a.eyeY + 3, 3, 1, MOUTH);
}

const SKIN = {
  knight:    ['#eec49b', '#c99a72'],
  archer:    ['#e8bd93', '#c1906a'],
  mage:      ['#f6ddc9', '#d6b099'],
  alchemist: ['#e0b992', '#b98d6b'],
};

// ---- per-class garments. BODY paints everything below the neck (plus any prop
// that hangs behind the figure); HEADGEAR paints over the bare head.
const BODY = {
  knight(P, c, a) {
    const st = tone(c.metal, 1), stLo = tone(c.metal, 0.62), stHi = tone(c.metal, 1.3);
    const cl = tone(c.accent, 1), clLo = tone(c.accent, 0.62), clHi = tone(c.accent, 1.3);
    const skin = SKIN.knight[0];
    if (a.down) {
      legs(P, a, tone(c.accent, 0.4), '#3b2a20');
      torso(P, a, st, stLo, stHi);

// The drop-in contract from HANDOFF_ART.md: art/sprites/<name>_front|_back|_down.png.
// Whatever is delivered replaces that character's procedural billboard on load;
// whatever is missing keeps the placeholder, per character AND per pose. Detection

// game is the pixel-art build untouched; with it present a static listing names the
// files, so the usual case probes nothing that isn't there.
const ART_NAMES = ['cassien', 'brecht', 'seira', 'miner', 'alchemist'];

// optional walk. Every file is independent: a character can have a side view with
// no side walk, front walks with no back walks, or nothing but _front.
const ART_VIEWS = ['front', 'back', 'side'];
// A view's gait is however many numbered walk frames were drawn for it, walk1
// upward, contiguous. Nothing in the engine knows what N ought to be: two frames
// and a fully drawn eight-frame stride are the same code path, and characters
// with different counts share a scene.
const ART_WALK_MAX = 8;

for (const view of ART_VIEWS) {

const ART_H = 1.63;

const artBustCache = {};

  const c = document.createElement('canvas'); c.width = cols; c.height = rows;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, cols, rows);
  const d = x.getImageData(0, 0, cols, rows).data;
  return (ux, uy) => d[((Math.min(rows - 1, Math.max(0, Math.floor((1 - uy) * rows))) * cols) +

// facing toward the lens is the front, away is the back, with a deadband so a
// side-on figure holds whatever it already had rather than flickering. With a
// _side plate delivered the circle is quantised into three: the 90° wedge centred
// on the camera is the front, the 90° wedge centred away is the back, and the two
// quarters between them are the profile, mirrored for leftward vs rightward.
// The wedge walls are pushed out past the nominal ±45°, because on this board the
// nominal boundary is exactly where the art lives: the tactics camera sits on 45°
// azimuth steps and units face grid axes, so a unit's facing is ALWAYS 45° or 135°
// off the lens. A hard ±45° wall would leave every unit balanced on it, tipping
// into the profile or out of it on nothing but how far off-centre the unit stands

// Every delivered file is fetched and decoded in one parallel pass, and the units
// stay hidden until it settles — whichever way it settles, including "no art/
// directory at all", which costs one 404 and resolves at once.
const artReady = (async () => {
  try {
    let listed = null;
    try {
      const res = await fetch('art/sprites/');
      if (res.ok) {
        const txt = await res.text();
        const seen = new Set(Array.from(
          txt.matchAll(/[a-z]+_(?:front|back|down|side)(?:_walk[1-8])?\.png/g), m => m[0]));
        if (seen.size) listed = seen;            // a directory index names the files exactly
      }
      // Static hosts such as GitHub Pages do not expose directory indexes.
      // In that case, fall through to the bounded filename probe below.
    } catch (err) { /* filename probing below still works */ }
    const load = async (n, pose) => {
      try {
        const res = await fetch('art/sprites/' + n + '_' + pose + '.png');
        if (!res.ok) return false;
        const blob = await res.blob();
        if (!blob.size) return false;
        const img = new Image();
        img.src = URL.createObjectURL(blob);
        await img.decode();                     // rejects on anything that isn't an image
        (art[n] || (art[n] = {}))[pose] = artFrame(img);
        return true;
      } catch (err) { return false; }           // unreadable or not an image: stays procedural
    };
    // A complete cast now contains well over a hundred large PNGs. Asking the
    // browser to fetch and decode all of them simultaneously caused occasional
    // frames to vanish under memory pressure, leaving a walk cycle randomly
    // short for that page load. A small worker pool keeps startup deterministic
    // without serialising the entire art pass.
    const loadBounded = async (items, limit = 8) => {
      let next = 0;
      const worker = async () => {
        while (next < items.length) {
          const [n, pose] = items[next++];
          await load(n, pose);
        }
      };
      await Promise.all(Array.from(
        { length: Math.min(limit, items.length) }, () => worker()));
    };
    const want = [];
    for (const n of ART_NAMES) for (const pose of ART_POSES) {
      if (!listed || listed.has(n + '_' + pose + '.png')) want.push([n, pose]);
    }
    if (listed) {
      await loadBounded(want);
    } else {
      // No directory index to read, so the walk frames have to be discovered. They
      // are numbered contiguously by contract, which means the first miss is the
      // end of the cycle — walking up from walk1 and stopping there costs one 404
      // per view instead of eight.
      await Promise.all([
        ...want.filter(([, p]) => !p.includes('_walk')).map(([n, p]) => load(n, p)),
        ...ART_NAMES.flatMap(n => ART_VIEWS.map(async view => {
          for (let i = 1; i <= ART_WALK_MAX; i++) if (!await load(n, view + '_walk' + i)) return;
        })),
      ]);
    }
    let any = false;
    for (const u of units) any = useArt(u) || any;
    for (const a of cliffActors) useActorArt(a);
    for (const a of minePartyActors) useActorArt(a);
    if (any) { renderStrip(); if (dlgLines) drawBeat(); }
  } finally {
    for (const u of units) u.group.visible = true;
    for (const a of cliffActors) a.group.visible = true;

})();

function hpSprite(team) {
  const c = document.createElement('canvas'); c.width = 96; c.height = 16;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false, fog: false, toneMapped: false }));
  sp.scale.set(0.6, 0.1, 1); sp.renderOrder = 900;
  sp.userData.draw = (frac) => {
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 96, 16);
    // every colour goes through uiCol so the grade delivers what is written here
    ctx.fillStyle = uiCss(0x080a14, 0.88);
    ctx.beginPath(); ctx.roundRect(0, 0, 96, 16, 5); ctx.fill();
    ctx.strokeStyle = team === 'player' ? uiCss(0x96cdf5, 0.85) : uiCss(0xf0968c, 0.8);
    ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(1, 1, 94, 14, 4.5); ctx.stroke();
    const w = Math.max(0, Math.round(86 * frac));
    ctx.fillStyle = uiCss(frac > 0.55 ? 0x5fd08a : frac > 0.28 ? 0xdcc35a : 0xd8624f);
    if (w > 0) { ctx.beginPath(); ctx.roundRect(5, 4, w, 8, 3); ctx.fill(); }
    tex.needsUpdate = true;
  };
  sp.userData.draw(1);
  return sp;
}

function floatText(txt, pos, color) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = FT_FONT;
  const w = Math.ceil(ctx.measureText(String(txt)).width) + FT_PAD * 2;
  c.width = Math.max(64, w); c.height = FT_H;
  // resizing the canvas resets the 2D state, so every draw setting is re-applied here
  ctx.font = FT_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 6; ctx.strokeStyle = uiCss(0x060810, 0.9); ctx.strokeText(txt, c.width / 2, 34);
  // callers pass '#rrggbb'; pre-compensate it like every other piece of UI colour
  ctx.fillStyle = uiCss(parseInt(String(color).replace('#', ''), 16));
  ctx.fillText(txt, c.width / 2, 34);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false, fog: false, toneMapped: false });
  const sp = new THREE.Sprite(m);
  sp.scale.set(c.width * FT_PER_PX, FT_SCALE_Y, 1); sp.renderOrder = 950;

}

function croppedSceneCanvas(img, padding = 0.045) {
  const probe = document.createElement('canvas');
  probe.width = img.naturalWidth; probe.height = img.naturalHeight;
  const pctx = probe.getContext('2d', { willReadFrequently: true });
  pctx.drawImage(img, 0, 0);
  const data = pctx.getImageData(0, 0, probe.width, probe.height).data;
  let x0 = probe.width, y0 = probe.height, x1 = 0, y1 = 0;
  for (let y = 0; y < probe.height; y++) for (let x = 0; x < probe.width; x++) {
    if (data[(y * probe.width + x) * 4 + 3] < 18) continue;
    x0 = Math.min(x0, x); y0 = Math.min(y0, y);
    x1 = Math.max(x1, x); y1 = Math.max(y1, y);
  }
  if (x1 <= x0 || y1 <= y0) return probe;
  const pad = Math.ceil(Math.max(x1 - x0, y1 - y0) * padding);
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
  x1 = Math.min(probe.width - 1, x1 + pad); y1 = Math.min(probe.height - 1, y1 + pad);
  const out = document.createElement('canvas');
  out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  out.getContext('2d').drawImage(img, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}

async function loadMineSprite(actor) {
  const res = await fetch(actor.path);
  if (!res.ok) throw new Error(actor.path + ': HTTP ' + res.status);
  const img = new Image(); img.src = URL.createObjectURL(await res.blob());
  await img.decode();
  const canvas = croppedSceneCanvas(img);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  actor.sprite.material.map = tex;
  actor.sprite.material.needsUpdate = true;
  actor.sprite.geometry.dispose();
  actor.sprite.geometry = new THREE.PlaneGeometry(actor.height * canvas.width / canvas.height, actor.height);
  actor.group.visible = true;
}

async function loadMinePortrait(key, path) {
  const res = await fetch(path);

}

// ---------------------------------------------------------------- turn state machine
let queue = [], qi = -1, round = 0;

}

function newRound() {

  qi = -1;

function nextTurn() {

// ---------------------------------------------------------------- placeholder portraits
// Busts are a nearest-neighbour zoom into the head and shoulders of the very same
// pixel sprite that stands on the field, so portrait and unit can never disagree.
// Real art in portraits/ still overrides these everywhere.
const faceCache = {};
const BUST = { x: 4, y: 1, w: 24, h: 24 };     // crop window in sprite pixels
function spriteBust(kind, palKey, team) {
  const key = 'bust|' + kind + '|' + palKey + '|' + team;
  if (faceCache[key]) return faceCache[key];
  const grid = unitSprite(kind, palKey, 'stand').grid;
  const S = 96, sc = S / BUST.w;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0, team === 'player' ? '#2b3560' : '#452a34');
  g.addColorStop(1, '#10162c');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  for (let j = 0; j < BUST.h; j++) for (let i = 0; i < BUST.w; i++) {
    const col = grid[(BUST.y + j) * SPX + (BUST.x + i)];
    if (!col) continue;
    x.fillStyle = col;
    x.fillRect(Math.round(i * sc), Math.round(j * sc), Math.ceil(sc), Math.ceil(sc));
  }
  x.strokeStyle = 'rgba(8,10,20,0.65)'; x.lineWidth = 10;

// story/opening-scene.md is authoritative: the game parses it at runtime, so a
// rewrite of the script is a rewrite of the game with no code change. The format
// it has to honour is exactly the format the writer already uses —
//   sections separated by a line of '---'
//   '**Name:** text'            a spoken line
//   '*...*' on its own          a stage direction (a narration card)
//   '*[GAMEPLAY: ...]*'         the battle break
// Everything else (the title, anything unparseable) is ignored. If the file is
// missing or yields no gate dialogue, FALLBACK_SCENES below stands in and the
// game plays exactly as it did before the script was wired up.

    .replace(/\*\([^)]*\)\*/g, '')          // *(To the girl.)*

    for (const raw of sec.split(/\r?\n\s*\r?\n/)) {
      const p = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean).join(' ').trim();
      if (!p || p.startsWith('#')) continue;
      const spoken = p.match(/^\*\*(.+?):\*\*\s*(.*)$/);
      if (spoken) {
        const text = stripInline(spoken[2]);
        if (!text) continue;
        const who = stripInline(spoken[1]);
        if (gateSec < 0 && /guard/i.test(who)) gateSec = si;
        beats.push({ kind: 'line', who, text, sec: si });
        continue;
      }
      if (!(p.startsWith('*') && p.endsWith('*'))) continue;
      const inner = p.slice(1, -1).trim().replace(/^\[/, '').replace(/\]$/, '').trim();
      if (/^GAMEPLAY\b/i.test(inner)) { if (gameplaySec < 0) gameplaySec = si; continue; }
      const text = stripInline(inner);
      // stage directions are STAGING, not dialogue (Jonah 2026-07-27): the scene
      // itself depicts them — parse and discard so scene mapping keeps its indices.
      if (text) beats.push({ kind: 'narr', text, sec: si, skip: true });
    }

  if (gameplaySec < 0) gameplaySec = sections.length;

  const gate = beats.filter(b => b.sec >= gateSec && b.sec < gameplaySec);

  // The remainder is the mine sanctuary scene and is staged in the third world.
  const post = [];

    const b = beats[i];
    if (b.sec <= gameplaySec) continue;
    post.push(b);

      postEnd = i;

}

  // mirror therefore runs opposite the logical screen direction. Rear plates
  // already read correctly under the old convention and deliberately keep it.
  // Treating front and back identically made face-on opponents appear to look
  // past one another even while their logical yaws were correct.

    return {
      fps: WALK_FPS, maxWalkFrames: ART_WALK_MAX, cyclesPerTile: WALK_CYCLES_PER_TILE,
      contactHold: WALK_CONTACT_HOLD,
      weights: [2, 4, 8].reduce((o, n) => (o[n] = walkWeights(n).w, o), {}),
      battleWalk: BATTLE_WALK_ANIM, sideInBattle: SIDE_VIEW_IN_BATTLE,
      cliffExitSpeed: CLIFF_EXIT_SPEED,
      cliffExitCameraLead: CLIFF_EXIT_CAMERA_LEAD,
      cliffPathStart: CLIFF_PATH_START,
      cliffLayout: {
        shelfTop: +cliffTopY.toFixed(3),
        shelfFarZ: +(CLIFF_PATH_END + 1.03).toFixed(3),
        townHouseNearZ: TOWN_HOUSE_NEAR_Z,
        townBasinY: TOWN_BASIN_Y,
      },
      units: units.map(row), actors: cliffActors.map(row),
      exit: cliffExit ? { t: +cliffExit.t.toFixed(3), maxDistance: CLIFF_EXIT_MAX } : null,
      exitCompletedOffscreen: cliffExitCompletedOffscreen,
    };
  },
  occlusion: () => buildingOccluders.map(building => ({
    name: building.name,
    blocked: building.blocked,
    opacity: +building.opacity.toFixed(3),
  })),
  // rest/hover state of the four chevrons, for UI tests
  arrowStates: () => faceArrows.filter(m => m.visible).map(m => ({
    dir: m.userData.faceDir, hot: m === faceHover,
    scale: +m.scale.x.toFixed(3), opacity: +m.material.opacity.toFixed(3),
    color: m.material.color.getHexString(),
  })),
  // the end-of-turn facing beat, for UI tests; null unless the picker is up
  facingPicker: () => facingPick && {
    unit: facingPick.unit.name,
    arrows: faceArrows.filter(m => m.visible).map(m => ({
      dir: m.userData.faceDir,
      screen: (p => ({ x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight }))(
        m.position.clone().project(camera)),
    })),
  },
  // character-art inspection: which units picked up delivered art, and how it sits
  artReady, art: () => units.map(u => ({
    id: u.id, name: u.name, key: ART_BY_PAL[u.pal],
    frames: u.art ? Object.keys(u.art) : [], face: u.artFace, frameKey: u.artKey, downed: u.downed,
    topY: +u.topY.toFixed(3), tilt: +u.sprite.rotation.x.toFixed(3),
    quad: [+u.sprite.geometry.parameters.width.toFixed(3), +u.sprite.geometry.parameters.height.toFixed(3)],
    footY: +(u.sprite.position.y - u.sprite.geometry.parameters.height / 2).toFixed(3),
    opacity: +u.sprite.material.opacity.toFixed(2), tint: u.sprite.material.color.getHexString(),
    paintedPortrait: faceOf(u) !== spriteBust(u.kind, u.pal, u.team),
  })),
};

// The scene opens wide on the whole diorama, then eases in on the confrontation —
// the midpoint between the party and the gate guard who speaks first — over about
// three seconds, landing just after his first line lands. Computed from live
// positions, so moving a deployment moves the opening shot with it. The wheel
// cancels the zoom leg mid-flight and a drag cancels the pan leg; advancing the
// dialogue does neither, so clicking through lines never jump-cuts the camera.
const OPEN_ZOOM = 1.9, OPEN_TIME = 2.9;
function frameConfrontation(instant = false) {
  const party = living('player'), guard = GATE_SPEAKERS['Town Guard'] || speakerUnit('Guard');
  if (!party.length || !guard) return;
  const px = party.reduce((s, u) => s + u.x, 0) / party.length;
  const pz = party.reduce((s, u) => s + u.z, 0) / party.length;
  if (instant) {
    glide = null; zoomAnim = null;
    CENTER.x = (px + guard.x) / 2 + 0.5;
    CENTER.z = (pz + guard.z) / 2 + 0.5;
    clampCenter();
    camera.zoom = OPEN_ZOOM;
    camera.updateProjectionMatrix();
    placeCamera();
    return;
  }
  centerOn((px + guard.x) / 2, (pz + guard.z) / 2, OPEN_TIME);
  zoomTo(OPEN_ZOOM, OPEN_TIME);
}

// ---------------------------------------------------------------- opening scene
// The reference composition is a held overlook: the trio talk in place, then move
// toward the foreground/down-screen only after Cassien settles the argument.
// The path's x-meander still guides their one-way departure.
const CLIFF_EXIT_SPEED = 1.05;        // ~2.1 stride cycles/sec: purposeful, not fast-forward
const CLIFF_EXIT_MAX = 8.0;           // safety cap; normal completion is screen-space
// A quiet crane toward Narshe lets the actors cover only 1 / (1 + 1.5) = 40%
// of the former ground distance while still walking completely through the
// lower frame. Their own pace and gait cadence stay untouched.
const CLIFF_EXIT_CAMERA_LEAD = 1.5;
// Begin only on stable contact phases. Third-cycle offsets dropped Brecht and
// Seira directly into up/passing drawings when the held tableau released,
// which read as a visual pop beside Cassien's contact start. The opposing
// half-cycle still keeps the three bodies from feeling mechanically identical.
const CLIFF_GAIT_OFFSETS = [0, 0.5, 0];
let cliffExit = null;
let cliffExitCompletedOffscreen = false;
function cliffPathXAt(z) {
  const z0 = Math.floor(z), f = z - z0;
  return cliffPathX(z0) * (1 - f) + cliffPathX(z0 + 1) * f;
}
function startCliffExit(done) {
  if (cliffExit || !cliffActors.length) return;
  cliffExitCompletedOffscreen = false;
  const home = cliffActors.map(a => ({ x: a.group.position.x, z: a.group.position.z }));
  cliffExit = { home, t: 0, done, cameraZ: CENTER.z };
  cliffActors.forEach((a, i) => { a.gaitOffset = CLIFF_GAIT_OFFSETS[i] || 0; });
  for (const a of cliffActors) setWalking(a, true);
}
function stopCliffExit() {
  if (!cliffExit) return;
  for (const a of cliffActors) setWalking(a, false);
  cliffExit = null;
}
function stepCliffExit(dt) {
  const exit = cliffExit;
  if (!exit || !cliffsWorld.visible) return;
  exit.t = Math.min(CLIFF_EXIT_MAX, exit.t + CLIFF_EXIT_SPEED * dt);
  cliffActors.forEach((a, i) => {
    const h = exit.home[i], z = h.z - exit.t;
    a.group.position.z = z;
    a.group.position.x = h.x + (cliffPathXAt(z) - cliffPathXAt(h.z)) * 0.5;
    a.group.position.y = cliffTopY;
    a.group.rotation.y = Math.PI;                     // -z projects down toward the foreground
  });
  // Move the lens toward the destination as the formation advances toward us.
  // This is deliberately scripted outside clampCenter(): the tactical camera
  // limits do not describe a cutscene crane over the town basin.
  CENTER.z = exit.cameraZ + exit.t * CLIFF_EXIT_CAMERA_LEAD;
  placeCamera();
  camera.updateMatrixWorld();
  const allBelowFrame = cliffActors.every(a => {
    const p = new THREE.Vector3(
      a.group.position.x, a.group.position.y + ART_H * 0.5, a.group.position.z,
    ).project(camera);
    return p.y < -1.16;
  });
  if (allBelowFrame || exit.t >= CLIFF_EXIT_MAX) {
    cliffExitCompletedOffscreen = allBelowFrame;
    const done = exit.done;
    stopCliffExit();
    if (done) done();
  }
}
function departCliffs(done) {
  let fade = null;
  const beginFade = () => { fade = sceneFade(done); };
  startCliffExit(beginFade);
  return { skip: () => {
    if (fade) { fade.skip(); return; }
    stopCliffExit();
    fade = sceneFade(done);
    fade.skip();
  } };
}
// cliffs -> town: a straight fade through black. The switch happens at full black,
// so the lighting regrade and the camera jump are never seen; a click during the
// fade cuts it short instead of stacking behind it.
let townEntered = false;
function enterTown() {
  if (townEntered) return;
  townEntered = true;
  stopCliffExit();
  showScene('town');
  azimuth = azTarget = azFrom = BATTLE_START_AZIMUTH;
  azT = 1;
  CENTER.set(W / 2, 1.8, D / 2); clampCenter();
  camera.zoom = 1.0; camera.updateProjectionMatrix();
  placeCamera();
  frameConfrontation();                     // the classic slow push-in on the gate
}
function transitionToMine(done) {
  const el = document.getElementById('fadeout');
  const T = FAST_SIM ? 30 : 720, HOLD = FAST_SIM ? 10 : 180;
  el.style.transition = `opacity ${T}ms ease-in-out`;
  el.style.opacity = '1';
  setTimeout(() => {
    enterMine();
    setTimeout(() => {
      el.style.opacity = '0';
      startMineEntrance(done);
    }, HOLD);
  }, T);
  return {};
}
function sceneFade(done) {
  const el = document.getElementById('fadeout');
  const T = FAST_SIM ? 30 : 780, HOLD = FAST_SIM ? 10 : 220;
  const CAMERA_SETTLE = FAST_SIM ? HOLD + T : Math.max(HOLD + T, OPEN_TIME * 1000);
  const timers = [];
  el.style.transition = `opacity ${T}ms ease-in-out`;
  el.style.opacity = '1';
  timers.push(setTimeout(() => {
    enterTown();
    timers.push(setTimeout(() => {
      el.style.opacity = '0';
    }, HOLD));
    // Do not reveal the first guard line until the confrontation framing is
    // complete. Otherwise its speaker-anchored bubble visibly slides while the
    // camera is still pushing in.
    timers.push(setTimeout(() => {
      if (FAST_SIM) frameConfrontation(true);
      done();
    }, CAMERA_SETTLE));
  }, T));
  return { skip: () => {
    timers.forEach(clearTimeout);
    enterTown();
    frameConfrontation(true);
    el.style.transition = 'opacity 220ms ease-out';
    el.style.opacity = '0';
  } };
}
// the whole pre-battle run is ONE dialogue: cliffs beats, the transition, then the
// gate. advance() therefore walks the player (or a bot) from the first stage
// direction all the way to round 1 without ever handing control back.
function openingBeats() {
  const cliffs = SCENES.cliffs.map((b, i) => Object.assign({}, b, {
    onShow: i === 0
      ? () => { const c = overlookCenter(); centerOn(c.x, c.z, CLIFF_PUSH); zoomTo(CLIFF_CLOSE, CLIFF_PUSH); }
      : null,
  }));
  const bridge = {
    kind: 'fx',
    skippable: false,
    run: finish => departCliffs(finish),
  };
  return cliffs.concat(cliffs.length ? [bridge] : [], SCENES.gate);
}
let openResolve;
const opened = new Promise(res => { openResolve = res; });   // settles when the card lifts
let splashDone = () => {
  if (!SCENES.cliffs.length) enterTown();
  startDialogue(openingBeats(), newRound);
  openResolve();
};

// ---------------------------------------------------------------- animate
// The entry card is an opaque curtain, and it stays up until every delivered
// sprite and portrait has decoded and been handed to its unit — so the painted
// art is what the player sees first and the placeholders are never glimpsed. The
// cap means a hung or corrupt file costs a few seconds, not the game; with no art
// delivered at all both promises settle immediately and only the floor applies,
// which is the pacing the card always had.
const SPLASH_FLOOR = 1700, SPLASH_CAP = 6000, SPLASH_FADE = 900;
const assetsReady = Promise.race([
  Promise.all([artReady, mineArtReady, portraitsReady, scriptReady, musicReady]),
  new Promise(res => setTimeout(res, SPLASH_CAP)),
]);
// tooling waits on these rather than guessing at the card's duration
Object.assign(window.__BATTLE, { assetsReady, portraitsReady, opened });
const clock = new THREE.Clock();
let splashStarted = false;
function openFromSplash(sp) {
  if (!sp || sp.classList.contains('out')) return;
  startMusic();
  // resume() must be called in the trusted click/key event on browsers that
  // block audible autoplay. Only reveal the scene once that attempt has landed,
  // so the overlook never begins silently and catches up on the next dialogue.
  const resume = actx && actx.state !== 'running'
    ? actx.resume().catch(() => {})
    : Promise.resolve();
  Promise.resolve(resume).finally(() => {
    if (sp.classList.contains('out')) return;
    sp.classList.remove('ready');
    sp.classList.add('out');
    setTimeout(() => {
      sp.remove();
      if (splashDone) splashDone();
    }, SPLASH_FADE);
  });
}
addEventListener('keydown', event => {
  const sp = document.getElementById('splash');
  if (!sp || !sp.classList.contains('ready') ||
      !['Enter', ' ', 'Spacebar'].includes(event.key)) return;
  event.preventDefault();
  openFromSplash(sp);
});
function animate() {
  requestAnimationFrame(animate);
  if (!splashStarted) {                    // first rendered frame: run the scene-entry card
    splashStarted = true;
    const sp = document.getElementById('splash');
    if (sp) {
      sp.classList.add('run');
      Promise.all([assetsReady, new Promise(res => setTimeout(res, SPLASH_FLOOR))]).then(() => {
        sp.classList.add('ready');
        sp.addEventListener('pointerdown', () => openFromSplash(sp), { once: true });
        startMusic();                         // autoplay where permitted
        if (!actx || actx.state === 'running') openFromSplash(sp);
      });
    }
  }
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (dlgLines) placeDlgBubble();

  if (azT < 1) {
    azT = Math.min(1, azT + dt / ROT_TIME);
    azimuth = azFrom + (azTarget - azFrom) * easeInOut(azT);
    placeCamera();
  }
  if (zoomAnim) {
    zoomAnim.t = Math.min(1, zoomAnim.t + dt / zoomAnim.dur);
    camera.zoom = zoomAnim.from + (zoomAnim.to - zoomAnim.from) * easeInOut(zoomAnim.t);
    camera.updateProjectionMatrix();
    if (zoomAnim.t >= 1) zoomAnim = null;
  }
  if (glide) {
    glide.t = Math.min(1, glide.t + dt / glide.dur);
    const p = easeInOut(glide.t);
    CENTER.x = glide.fx + (glide.tx - glide.fx) * p;
    CENTER.z = glide.fz + (glide.tz - glide.fz) * p;
    clampCenter(); placeCamera();
    if (glide.t >= 1) glide = null;
  }

  hoistWheel.rotation.z += dt * 0.4;
  updateGame(dt, t);

  for (const sm of smokeStacks) {
    sm.children.forEach((puff, i) => {
      const cyc = (t * 0.4 + i * 0.25) % 1;
      puff.position.y = cyc * 1.4;
      puff.position.x = Math.sin(t * 1.2 + i * 2.1) * 0.08 * cyc;
      puff.material.opacity = 0.38 * (1 - cyc) * Math.min(1, cyc * 6);
      puff.scale.setScalar(0.7 + cyc * 1.1);
    });
  }

  if (snowPts.parent) {
    const p = snowPts.geometry.attributes.position;
    const { drift, rangeX, rangeZ, height } = snowPts.userData;
    for (let i = 0; i < p.count; i++) {
      let y = p.getY(i) - dt * (0.55 + 0.25 * Math.sin(drift[i]));
      if (y < 0) {
        y = height;
        p.setX(i, CENTER.x + (Math.random() - 0.5) * rangeX);
        p.setZ(i, CENTER.z + (Math.random() - 0.5) * rangeZ);
      }
      p.setX(i, p.getX(i) + Math.sin(t * 0.8 + drift[i]) * dt * 0.18);
      p.setY(i, y);
    }
    p.needsUpdate = true;
  }

  if (!FAST_SIM || (frameNo++ % 10 === 0)) composer.render();
}
let frameNo = 0;
animate();
</script>
</body>
